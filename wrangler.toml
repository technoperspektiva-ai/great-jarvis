name = "great-jarvis"
main = "src/index.js"
compatibility_date = "2026-09-20"

[vars]
SYSTEM_PROMPT = "Ты Great Jarvis — полезный AI-ассистент в Telegram. Отвечай на языке пользователя, понятно, естественно и по делу."
AUTO_FALLBACK = "true"

[[durable_objects.bindings]]
name = "USER_PREFS"
